[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-tts-gradio"
version = "0.1.0"
description = "Portable Gradio UI for OpenAI-compatible TTS servers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "gradio>=5.50,<7",
  "httpx>=0.27,<1",
]

[project.scripts]
openai-tts-gradio = "openai_tts_gradio:main"

[tool.setuptools]
py-modules = ["openai_tts_gradio"]

[tool.setuptools.packages.find]
include = ["openai_tts_gradio_app*"]
